version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: healora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healora_pass}
      POSTGRES_DB: ${POSTGRES_DB:-healora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healora_user -d healora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healora_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-healora_user}:${POSTGRES_PASSWORD:-healora_pass}@db:5432/${POSTGRES_DB:-healora_db}
      - SECRET_KEY=${SECRET_KEY:-healora-super-secure-production-ready-secret-key-change-me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_MINUTES=10080
      - BACKEND_CORS_ORIGINS=["*"]
      - FIREBASE_CREDENTIALS_PATH=
      - OPENAI_API_KEY=
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  uploads_data:
